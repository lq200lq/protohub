name: ✨ 功能请求
description: 建议新能力或改进现有体验
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述场景与痛点，而不是先给方案——方便大家一起找最优解。
      placeholder: 例如：评审时想把某个原型临时分享给外部同事，但不想设密码、又不想让对方看到项目里其他原型。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的方案（可选）
      placeholder: 例如：支持生成带有效期的一次性访问链接。
  - type: textarea
    id: alternatives
    attributes:
      label: 现在的替代做法（可选）
      placeholder: 例如：目前只能设公开访问，或手动把原型复制到别的项目。
  - type: textarea
    id: context
    attributes:
      label: 补充上下文
      description: 截图、竞品做法、相关文档/设计稿链接等。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，没有重复
          required: true
